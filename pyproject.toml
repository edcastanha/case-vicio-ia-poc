[project]
name = "classificacao"
version = "0.1.0"
description = "Classificação de questões penais na árvore de temas (case Vício)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "google-genai>=2.31.0",
    "numpy>=2.5.4",
    "openai>=3.31.0",
]

[project.scripts]
classificacao = "classificacao.entrada.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classificacao"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
