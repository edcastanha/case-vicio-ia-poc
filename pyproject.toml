[project]
name = "classificacao"
version = "0.1.0"
description = "Classificação de questões penais na árvore de temas (case Vício)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "google-genai>=2.31.0",
    "numpy>=2.5.4",
    "openai>=3.31.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
classificacao = "classificacao.cli:main"

[dependency-groups]
analise = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
]
dev = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7",
    "pytest>=8",
    "ruff>=0.6",
]
embeddings = [
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classificacao"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
