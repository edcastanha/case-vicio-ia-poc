site_name: Classificação de tópicos — case Vício
site_description: Como 359 questões penais foram classificadas na árvore de temas, e quando cada uma pode ir direto para o aluno.
site_url: https://edcastanha.github.io/case-vicio-ia-poc/
repo_url: https://github.com/edcastanha/case-vicio-ia-poc
repo_name: edcastanha/case-vicio-ia-poc
edit_uri: ""

docs_dir: docs
exclude_docs: |
  hooks/
hooks:
  - docs/hooks/site.py

theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Tema claro

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true  # trecho inexistente quebra o build, em vez de sumir calado
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tabelas.js
extra_css:
  - stylesheets/site.css

nav:
  - Resumo: index.md
  - Apresentação: apresentacao/index.html
  - Relatório: relatorio.md
  - Resultados: resultados.md
  - Memo ao Professor: memo-professor.md
  - Decisões:
      - adr/0001-poc-sem-mensageria-nem-banco.md
      - adr/0002-publicar-so-com-concordancia-entre-provedores.md
      - adr/0003-prompts-versionados-por-papel.md
      - adr/0004-rotulagem-assistida.md
      - adr/0005-texto-da-questao-e-dado-nunca-instrucao.md
      - adr/0006-amostra-rotulada-por-agente-juridico.md
      - adr/0007-desenho-de-producao.md
  - Glossário: glossario.md
  - Como rodar: como-rodar.md
  - Dados gerados: dados.md
